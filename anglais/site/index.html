<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions d&#39;anglais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
:root{
  --base:#e9edfa;
  --ink:#0d1226; --muted:#4b5272; --line:rgba(60,70,110,.14); --track:rgba(118,118,140,.14);
  --glass:rgba(255,255,255,.44); --glass-strong:rgba(255,255,255,.64); --glass-on:rgba(255,255,255,.88);
  --solid:#f3f5fd;
  --rim-hi:rgba(255,255,255,.98); --rim-lo:rgba(255,255,255,.22);
  --blur:blur(26px) saturate(190%);
  --shadow:0 10px 30px rgba(40,50,120,.12),inset 0 1px 0 rgba(255,255,255,.75);
  --accent:#006be6; --accent-soft:rgba(0,122,255,.14);
  --good:#147a36; --good-soft:rgba(52,199,89,.22); --bad:#c8001a; --bad-soft:rgba(255,59,48,.18);
  --t-blue:linear-gradient(135deg,rgba(10,132,255,.82),rgba(94,92,230,.74));
  --t-pink:linear-gradient(135deg,rgba(255,55,95,.82),rgba(255,120,60,.74));
  --t-orange:linear-gradient(135deg,rgba(255,149,10,.84),rgba(255,204,0,.74));
  --t-green:linear-gradient(135deg,rgba(48,209,88,.82),rgba(48,176,199,.74));
  --t-hero:linear-gradient(140deg,rgba(94,92,230,.80) 0%,rgba(10,132,255,.66) 55%,rgba(50,173,230,.60) 100%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  --blobs:
    radial-gradient(38% 30% at 12% 8%,#6f9bff 0%,transparent 72%),
    radial-gradient(34% 28% at 92% 18%,#ff8db0 0%,transparent 72%),
    radial-gradient(44% 36% at 85% 78%,#9a86ff 0%,transparent 72%),
    radial-gradient(40% 34% at 8% 82%,#5fe0cc 0%,transparent 72%),
    radial-gradient(30% 24% at 48% 46%,#ffd47e 0%,transparent 72%);
}
@media (prefers-color-scheme:dark){
  :root{
    --base:#05060d;
    --ink:#f4f5fa; --muted:#a6abc2; --line:rgba(255,255,255,.10); --track:rgba(255,255,255,.08);
    --glass:rgba(30,32,44,.46); --glass-strong:rgba(36,38,52,.62); --glass-on:rgba(255,255,255,.18);
    --solid:#15161f;
    --rim-hi:rgba(255,255,255,.42); --rim-lo:rgba(255,255,255,.05);
    --shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
    --accent:#4da3ff; --accent-soft:rgba(10,132,255,.24);
    --good:#4ade80; --good-soft:rgba(48,209,88,.22); --bad:#ff6b61; --bad-soft:rgba(255,69,58,.22);
    --blobs:
      radial-gradient(38% 30% at 12% 8%,#1c3f9e 0%,transparent 72%),
      radial-gradient(34% 28% at 92% 18%,#7a1f52 0%,transparent 72%),
      radial-gradient(44% 36% at 85% 78%,#3b2a9a 0%,transparent 72%),
      radial-gradient(40% 34% at 8% 82%,#0c5c57 0%,transparent 72%),
      radial-gradient(30% 24% at 48% 46%,#6a4710 0%,transparent 72%);
  }
}
@media (prefers-reduced-transparency:reduce){
  :root{--glass:var(--solid);--glass-strong:var(--solid)}
}
*{box-sizing:border-box}
html{background:var(--base)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:var(--blobs),var(--base);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,[data-edit]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}

/* ---------- Verre : surface, flou, liseré lumineux ---------- */
.panel,.postcard,.tabs,.opts,.x,.btn.ghost,.stat,.mode,.speak,.seg,.chips.seg button,.btn.main,.btn.ok,.btn.ko,input[type=text],input[type=search]{
  position:relative;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.panel::before,.postcard::before,.tabs::before,.opts::before,.x::before,.btn.ghost::before,.stat::before,.mode::before,.speak::before,.btn.main::before,.btn.ok::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,var(--rim-hi) 0%,var(--rim-lo) 38%,transparent 55%,var(--rim-lo) 75%,var(--rim-hi) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* En-tête */
header{display:flex;flex-direction:column;margin:4px 0 18px}
h1{font-family:var(--font-d);font-weight:800;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
h1 .flag{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--t-hero);font-size:1.3rem;box-shadow:0 6px 18px rgba(60,90,255,.35),inset 0 1px 0 rgba(255,255,255,.6)}

/* Barre d'onglets flottante */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:min(360px,calc(100% - 32px));
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:999px;background:var(--glass-strong);box-shadow:0 12px 40px rgba(20,30,80,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.tabs button{border:0;background:transparent;padding:11px 6px;border-radius:999px;font-size:.9rem;font-weight:600;color:var(--ink);transition:background .25s,color .25s}
.tabs button.on{background:var(--glass-on);color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.8)}

.panel{background:var(--glass);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.panel + .panel,.hero + .panel{margin-top:16px}
.small{font-size:.85rem;color:var(--muted)}
.label{font-size:.82rem;font-weight:600;color:var(--muted);margin:18px 0 8px}
.label.lead{font-family:var(--font-d);font-size:1.35rem;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin:26px 4px 12px}

.postcard{background:var(--glass);border-radius:26px;box-shadow:var(--shadow)}

/* Mot du jour */
.hero{background:var(--t-hero);color:#fff;padding:20px 20px 22px;overflow:hidden;box-shadow:0 16px 40px rgba(60,80,230,.30),inset 0 1px 0 rgba(255,255,255,.6)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.06) 32%,transparent 50%);pointer-events:none}
.hero-k{font-size:.85rem;font-weight:600;opacity:.9}
.hero-w{position:relative;z-index:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 0 2px;margin:0;text-align:left;font-family:var(--font-d);font-weight:800;font-size:2.5rem;line-height:1.05;letter-spacing:-.035em;color:#fff;max-width:calc(100% - 90px);word-break:break-word;text-shadow:0 2px 12px rgba(0,0,40,.18)}
.hero-w .spk{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.hero-fr{font-size:1.15rem;font-weight:600;margin-top:6px}
.hero-note{font-size:.9rem;opacity:.9;margin-top:4px;position:relative;z-index:1}
.stamp{position:absolute;z-index:1;top:16px;right:16px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.22);color:#fff;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.stamp span{font-size:.72rem;letter-spacing:.02em;line-height:1.2}
.stamp small{font-size:.66rem;font-weight:600;opacity:.9}

/* Chiffres */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{padding:12px 12px 10px;border-radius:18px;color:#fff;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.55)}
.stat b{display:block;font-family:var(--font-d);font-size:1.9rem;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.stat span{font-size:.8rem;font-weight:600;opacity:.95}
.s-due{background:var(--t-pink)} .s-new{background:var(--t-blue)} .s-ok{background:var(--t-green)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:6px 0 8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0a84ff,#5e5ce6,#bf5af2);border-radius:99px;transition:width .5s;box-shadow:0 0 12px rgba(94,92,230,.55)}

/* Exercices */
.modes{display:grid;gap:12px}
.mode{overflow:hidden;display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:24px;padding:18px 16px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.mode:active{transform:scale(.97)}
.mode::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(165deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.05) 35%,transparent 50%);pointer-events:none}
.mode .ic{flex:0 0 46px;height:46px;border-radius:14px;background:rgba(255,255,255,.24);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.mode b{display:block;font-family:var(--font-d);font-weight:700;font-size:1.2rem;line-height:1.2;letter-spacing:-.02em}
.mode span{font-size:.88rem;opacity:.95}
.m-cards{background:var(--t-blue)} .m-quiz{background:var(--t-pink)} .m-write{background:var(--t-orange)}
.m-dict{background:linear-gradient(135deg,rgba(0,163,180,.86),rgba(48,209,88,.74))}
.speak.big-speak{width:88px;height:88px;margin:12px auto 6px;display:grid}
.speak.big-speak svg{width:40px;height:40px}
.m-hist{background:linear-gradient(135deg,rgba(94,92,230,.84),rgba(175,82,222,.74))}
.hrow{padding:12px 0;border-top:1px solid var(--line)}
.hhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hwords{margin-top:3px}
.rpl{display:flex;gap:8px;margin-top:8px}
.rpl .btn{flex:1;padding:9px 6px;font-size:.9rem}

/* Contrôles segmentés */
.seg{display:flex;gap:2px;background:var(--track);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 8px;font-size:.88rem;font-weight:600;color:var(--ink);transition:background .25s}
.seg button.on{background:var(--glass-on);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.8)}
.chips.seg{background:none;padding:0;gap:6px;flex-wrap:wrap;-webkit-backdrop-filter:none;backdrop-filter:none}
.chips.seg button{flex:0 0 auto;background:var(--track);padding:7px 14px}
.chips.seg button.on{background:var(--t-blue);color:#fff}
.sync{margin-top:20px;text-align:center}

/* Exercice en cours */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .bar{flex:1;margin:0}
.x{border:0;background:var(--glass-strong);width:38px;height:38px;padding:0;border-radius:50%;color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.x svg{width:18px;height:18px}
.count{font-size:.88rem;font-weight:600;color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.card{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:default}
.card.tap{cursor:pointer}
.dirtag{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:10px}
.word{font-family:var(--font-d);font-weight:800;font-size:2.4rem;line-height:1.1;letter-spacing:-.035em;word-break:break-word}
.word.fr{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
.hint{margin-top:18px;font-size:.86rem;color:var(--muted)}
.speak{border:0;background:var(--accent-soft);border-radius:999px;width:46px;height:46px;display:inline-grid;place-items:center;color:var(--accent);margin-top:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.detail{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;text-align:left;width:100%}
.detail .ans{font-size:1.2rem;font-weight:600}
.detail .en{font-family:var(--font-d);font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.pos{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.02em;line-height:1.5;border-radius:999px;padding:0 7px;margin-right:6px;vertical-align:.18em;background:var(--track);color:var(--muted)}
.pos.pn{background:rgba(10,132,255,.16);color:var(--accent)}
.pos.pv{background:rgba(255,55,95,.15);color:#d42a52}
.pos.pa{background:rgba(48,209,88,.18);color:var(--good)}
.pos.pd{background:rgba(255,149,10,.18);color:#b86a00}
.posl+.posl{margin-top:4px}
.hero-fr .pos,.opt.right .pos,.opt.wrong .pos{background:rgba(255,255,255,.28);color:inherit}
.detail .note{margin-top:6px;font-size:.92rem;color:var(--muted)}
.mine{margin-top:10px;font-size:.9rem;padding:9px 12px;border-radius:14px;background:var(--accent-soft)}
.mine em{font-style:italic}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:0;border-radius:999px;padding:15px 14px;font-weight:600;font-size:1.02rem;transition:transform .2s cubic-bezier(.2,1.4,.4,1),opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ok{background:var(--t-green);color:#fff;box-shadow:0 8px 20px rgba(48,209,88,.28),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.ko{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn.main{background:var(--t-blue);color:#fff;width:100%;box-shadow:0 10px 24px rgba(10,132,255,.32),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.ghost{background:var(--glass-strong);color:var(--accent);width:100%;box-shadow:var(--shadow)}
.btn:disabled{opacity:.5}
.opts{display:grid;gap:0;margin-top:16px;background:var(--glass);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.opt{border:0;border-top:1px solid var(--line);background:transparent;padding:15px 18px;text-align:left;font-size:1rem;font-weight:500;color:var(--ink)}
.opt:first-child{border-top:0}
.opt:active:not(:disabled){background:var(--track)}
.opt.right{background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.verdict{font-weight:600;margin-bottom:4px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
input[type=text],input[type=search]{width:100%;font:inherit;font-size:1.02rem;padding:12px 16px;border-radius:999px;border:1px solid var(--rim-lo);background:var(--track);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
input::placeholder{color:var(--muted)}
input:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.writebox{margin-top:16px;display:grid;gap:10px;width:100%}

/* Pastille de réponse */
.postmark{position:absolute;z-index:2;top:16px;right:14px;padding:5px 12px;border-radius:999px;font-size:.85rem;font-weight:700;color:#fff;animation:pop .4s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px rgba(0,0,0,.15)}
.postmark.good{background:var(--t-green)} .postmark.bad{background:var(--t-pink)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){ .postmark{animation:none} .mode,.btn,.bar i,.tabs button,.seg button{transition:none} }

/* Fin de série */
.endcard{padding:30px 20px 22px;text-align:center}
.big{font-family:var(--font-d);font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#5e5ce6,#0a84ff,#32ade6);-webkit-background-clip:text;background-clip:text;color:transparent}
.endlist{margin:14px 0 0;padding:0;list-style:none;text-align:left}
.endlist li{padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}

/* Mes mots */
.chips{margin:12px 0}
.row{padding:12px 2px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row b{font-weight:600;font-size:1.03rem}
.row .fr{color:var(--ink);font-size:.95rem}
.row .mn{font-size:.85rem;color:var(--muted);margin-top:2px}
.dots{display:flex;gap:3px;padding-top:7px;flex:0 0 auto}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.dots i.f{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
.empty{text-align:center;color:var(--muted);padding:24px 0}
.reset{margin-top:18px}
.confirm{margin-top:10px;padding:12px;border-radius:18px;background:var(--bad-soft);font-size:.92rem}
.confirm .actions{margin-top:10px}
.hidden{display:none!important}
.say{cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.say:active{opacity:.6}

/* Tableau */
.wrap.wide{max-width:1100px}
.tblp{padding:14px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:.92rem}
.tbl th,.tbl td{padding:11px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{border-top:0;font-size:.78rem;font-weight:600;color:var(--muted);white-space:nowrap}
.tbl thead th:first-child{position:sticky;left:0;z-index:2;background:var(--solid);border-radius:10px 0 0 0}
.tbl tbody th{position:sticky;left:0;z-index:1;background:var(--solid);font-weight:600;min-width:110px;max-width:150px;box-shadow:1px 0 0 var(--line)}
.tbl td{min-width:120px}
.tbl td.nt{color:var(--muted);min-width:240px}
.tbl td.mc{cursor:pointer;min-width:170px}
.tmode{margin-bottom:12px}
.tmiss{display:flex;align-items:center;gap:8px;margin-top:10px}
.tmiss input{width:18px;height:18px;margin:0}
.tbl.ttop{min-width:0;table-layout:auto}
.tbl.ttop th,.tbl.ttop td{padding:10px 5px}
.tbl.ttop td:nth-child(3){width:100%}
.tbl.ttop td{min-width:0}
.tbl.ttop tbody th{min-width:0;max-width:none;position:static;box-shadow:none;background:none}
.tbl.ttop thead th:first-child{position:static;background:none}
.tbl.ttop td.rk{color:var(--muted);font-variant-numeric:tabular-nums;width:1%;padding-right:4px}
.tbl.ttop td.ad{width:1%;text-align:center}
.tbl.ttop .ok{color:var(--good);font-weight:700}
.addone{border:0;border-radius:999px;width:30px;height:30px;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:1.15rem;font-weight:700;line-height:1}
.tbl .ph{color:var(--accent);font-weight:600}
.tbl .pen{color:var(--muted);font-size:.8rem}
#mineform{display:flex;gap:6px}
#mineform input{font-size:16px;padding:8px 12px;min-width:0}
.btn.sm{padding:8px 14px;font-size:.9rem;width:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag" aria-hidden="true">🇬🇧</span>Révisions d'anglais</h1>
    <div class="tabs" id="tabs">
      <button data-tab="home" class="on">Réviser</button>
      <button data-tab="list">Mes mots</button>
      <button data-tab="table">Tableau</button>
    </div>
  </header>
  <main id="app"></main>
  <div class="sync small" id="sync">Progrès enregistrés sur cet appareil</div>
</div>

<script>
// Données : [anglais, traduction de Claude, ta traduction (tes notes), remarque]
const DATA = [
["Acquaint","v. familiariser, mettre au courant","","be acquainted with = connaître ; get acquainted = faire connaissance ; an acquaintance = une connaissance (personne)"],
["Act up","v. faire des siennes, se conduire mal ; mal fonctionner (machine)","agir, se conduire mal",""],
["Acting","adj. par intérim, suppléant ; n. jeu d'acteur, métier d'acteur","par intérim","acting director = directeur par intérim"],

const W = DATA.map(([en,fr,mine,note],i)=>({i,en,fr,mine,note}));

// Nature du mot : la traduction commence par « n. », « v. », « adj. »… (ex. « n. brouillon ; v. rédiger »).
// Chaque partie est affichée avec une petite étiquette (nom, verbe, adj.…).
const POS = {"n.":["n.","pn"],"v.":["v.","pv"],"adj.":["adj.","pa"],"adv.":["adv.","pd"],"prép.":["prép.","po"],"conj.":["conj.","po"],"interj.":["interj.","po"],"expr.":["expr.","pe"],"pron.":["pron.","po"],"art.":["art.","po"],"dét.":["dét.","po"],"num.":["num.","po"]};
const POS_RE = /^(n|v|adj|adv|prép|conj|interj|expr|pron|art|dét|num)\.\s+/;
function frParts(s){
  const g = [];
  String(s||"").split(/\s*;\s*/).forEach(seg => {
    const m = seg.match(POS_RE);
    if (m || !g.length) g.push({p: m ? m[1]+"." : "", t: m ? seg.slice(m[0].length) : seg});
    else g[g.length-1].t += " ; " + seg;
  });
  return g;
}
function frHtml(s, block){
  const g = frParts(s);
  if (!g.some(x => x.p)) return esc(s);
  const one = x => (x.p ? `<span class="pos ${POS[x.p][1]}">${POS[x.p][0]}</span>` : "") + esc(x.t);
  return block ? g.map(x => `<div class="posl">${one(x)}</div>`).join("") : g.map(one).join(" ");
}

// ---------- Progrès (système de boîtes : 0 = nouveau, 5 = maîtrisé) ----------
const KEY = "vocab-progress-v1";
const DAY = 864e5;
const INTERVAL = [0, 0, 1, 3, 7, 15]; // jours avant de revoir le mot, selon sa boîte
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; }

// ---------- Mes traductions (modifiables dans l'onglet Tableau) ----------
const MKEY = "vocab-mine-v1";
let M = {};
try { M = JSON.parse(localStorage.getItem(MKEY)) || {}; } catch (e) { M = {}; }
function mSave(){ try { localStorage.setItem(MKEY, JSON.stringify(M)); } catch (e) {} }
W.forEach(w => { w.mine0 = w.mine; });
function applyMine(){ for (const w of W) w.mine = M[w.en] ? M[w.en].v : w.mine0; }
applyMine();
function setMine(w, v){ M[w.en] = { v: String(v).trim(), t: Date.now() }; mSave(); applyMine(); scheduleDb(); }

function rec(w){ return P[w.en] || {b:0,d:0,ok:0,ko:0,t:0}; }
function lsSave(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function grade(w, ok){
  const r = Object.assign({}, rec(w));
  if (ok) { r.b = r.b === 0 ? 2 : Math.min(5, r.b + 1); r.ok++; } else { r.b = 1; r.ko++; }
  r.d = Date.now() + INTERVAL[r.b] * DAY - (INTERVAL[r.b] ? 4*3600e3 : 0);
  r.t = Date.now();
  P[w.en] = r;
  lsSave(); scheduleDb();
}

// ---------- Synchronisation avec le compte (si disponible) ----------
let docRef = null, saving = false, again = false, dbTimer = null;
function setSync(on){
  document.getElementById("sync").textContent = on
    ? "Progrès synchronisés avec ton compte"
    : "Progrès enregistrés sur cet appareil";
}
function scheduleDb(){
  if (!docRef) return;
  clearTimeout(dbTimer);
  dbTimer = setTimeout(flushDb, 1500);
}
async function flushDb(){
  if (!docRef) return;
  if (saving) { again = true; return; }
  saving = true;
  try {
    await docRef.set({ words: P, mine: M, updatedAt: Date.now() });
  } catch (e) {
    const c = e && e.code;
    if (c === "unavailable" || c === "resource_exhausted") setTimeout(scheduleDb, 4000 + Math.random()*2000);
    else { docRef = null; setSync(false); }
  }
  saving = false;
  if (again) { again = false; flushDb(); }
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const rdata = snap.exists ? (snap.data() || {}) : {};
    const remote = rdata.words || {};
    const rmine = rdata.mine || {};
    let pull = false, push = false;
    for (const k in remote) {
      if (!P[k] || (remote[k].t || 0) > (P[k].t || 0)) { P[k] = remote[k]; pull = true; }
    }
    for (const k in P) {
      if (!remote[k] || (P[k].t || 0) > (remote[k].t || 0)) push = true;
    }
    for (const k in rmine) {
      if (!M[k] || (rmine[k].t || 0) > (M[k].t || 0)) { M[k] = rmine[k]; pull = true; }
    }
    for (const k in M) {
      if (!rmine[k] || (M[k].t || 0) > (rmine[k].t || 0)) push = true;
    }
    docRef = ref; setSync(true);
    if (pull) { lsSave(); mSave(); applyMine(); if (view === "home" || view === "list" || (view === "table" && editIdx === null)) render(); }
    if (push) scheduleDb();
  } catch (e) { docRef = null; setSync(false); }
})();

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘`]/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
const audioSlug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
let player = null;
function ttsFallback(t){
  if (!canSpeak) return;
  try { const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .92; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
// Lecture via Web Audio : un seul contexte audio gardé ouvert (évite le « pop » du téléphone
// à chaque démarrage de la sortie son), fondu d'entrée/sortie très court, cache des sons décodés.
let actx = null, curSrc = null, speakToken = 0;
const bufCache = {};
function getCtx(){
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    actx = new AC();
    // Souffle inaudible (~ -100 dB) pour que la sortie audio reste éveillée entre deux mots
    const n = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 1e-5;
    const keep = actx.createBufferSource(); keep.buffer = n; keep.loop = true;
    keep.connect(actx.destination); keep.start();
    document.addEventListener("visibilitychange", () => {
      try { if (document.hidden) actx.suspend(); else actx.resume(); } catch (e) {}
    });
  } catch (e) { actx = null; }
  return actx;
}
function stopCur(){
  if (!curSrc) return;
  try { const t = actx.currentTime; curSrc.g.gain.cancelScheduledValues(t); curSrc.g.gain.setValueAtTime(curSrc.g.gain.value, t); curSrc.g.gain.linearRampToValueAtTime(0, t + 0.015); curSrc.src.stop(t + 0.02); } catch (e) {}
  curSrc = null;
}
function loadBuf(url){
  if (bufCache[url]) return bufCache[url];
  bufCache[url] = fetch(url).then(r => { if (!r.ok) throw new Error("404"); return r.arrayBuffer(); })
    .then(ab => new Promise((res, rej) => actx.decodeAudioData(ab, res, rej)));
  bufCache[url].catch(() => { delete bufCache[url]; });
  return bufCache[url];
}
function speakEl(url, t){
  try {
    if (player) { try { player.pause(); } catch (e) {} }
    player = new Audio(url);
    const p = player.play();
    if (p && p.catch) p.catch(() => ttsFallback(t));
  } catch (e) { ttsFallback(t); }
}
// Versions des sons (audio/versions.json, écrit par le workflow) : un son refait change d'adresse,
// donc le téléphone ne rejoue pas l'ancien.
let AV = {};
function loadAV(){ fetch("audio/versions.json").then(r => r.ok ? r.json() : {}).then(d => { if (d && Object.keys(d).length) AV = d; }).catch(() => {}); }
loadAV();
// Retour dans l'appli après plus de 10 minutes : on recharge la page (nouveaux mots, nouvelle version),
// sauf pendant une série d'exercices ou une saisie.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  loadAV(); loadAV3();

let AV3 = {};

loadAV3();
function audioUrl(name){
  if (!AV[name] && AV3[name]) return "audio3000/" + name + ".mp3?v=" + AV3[name];
  return "audio/" + name + ".mp3?v=" + (AV[name] || "5");
}
function speak(t){
  const url = audioUrl(audioSlug(t));
  const ctx = getCtx();
  if (!ctx) return speakEl(url, t);
  try { if (ctx.state !== "running") ctx.resume(); } catch (e) {}
  const token = ++speakToken;
  loadBuf(url).then(buf => {
    if (token !== speakToken) return;
    stopCur();
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); const at = ctx.currentTime + 0.03;
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(1, at + 0.012);
    src.connect(g); g.connect(ctx.destination);
    src.start(at, Math.min(0.15, buf.duration / 4)); // saute une partie du silence de début : son plus réactif
    curSrc = { src, g };
    src.onended = () => { if (curSrc && curSrc.src === src) curSrc = null; };
  }).catch(() => { if (token === speakToken) speakEl(url, t); });
}

function counts(){
  const now = Date.now(); let fresh=0, due=0, known=0, pts=0;
  for (const w of W){ const r = rec(w); pts += r.b; if (r.b===0) fresh++; else if (r.d<=now) due++; if (r.b>=4) known++; }
  return { fresh, due, known, pct: Math.round(pts / (5*W.length) * 100) };
}

function buildQueue(n){
  const now = Date.now();
  const items = W.map(w => ({ i: w.i, r: rec(w) }));
  const byPrio = (a,b) => a.r.b - b.r.b || a.r.d - b.r.d;
  const due = items.filter(x => x.r.b>0 && x.r.d<=now).sort(byPrio);
  const fresh = shuffle(items.filter(x => x.r.b===0));
  const later = items.filter(x => x.r.b>0 && x.r.d>now).sort(byPrio);
  const cap = Math.ceil(n*0.7);
  const pick = [...due.slice(0,cap), ...fresh, ...due.slice(cap), ...later].slice(0,n);
  return shuffle(pick.map(x => x.i));
}

function sameAnswer(a, b, dir){ return dir==="en" ? norm(a.fr)===norm(b.fr) : norm(a.en)===norm(b.en); }

function options(w){
  const pool = shuffle(W.filter(x => x.i!==w.i && !sameAnswer(x,w,S.dir) && !(S.dir==="fr" && norm(x.fr)===norm(w.fr))));
  const picked = [];
  for (const x of pool){ if (picked.length===3) break; if (!picked.some(p => sameAnswer(p,x,S.dir))) picked.push(x); }
  return shuffle([w, ...picked]).map(x => x.i);
}

// Dictée : on compare au mot anglais, sans tenir compte des majuscules, de la ponctuation,
// des apostrophes ni d'un « to » devant un verbe.
const dnorm = s => norm(s).replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim().replace(/^to /, "");
function checkDict(w, input){ const t = dnorm(input); return !!t && t === dnorm(w.en); }

function checkTyped(w, input){
  const t = norm(input).replace(/^to /,"");
  if (!t) return false;
  return W.some(x => norm(x.fr)===norm(w.fr) && norm(x.en).replace(/^to /,"")===t);
}

function tableSwitch(){
  const b = (k,l) => `<button data-tmode="${k}" class="${tableMode===k?"on":""}">${l}</button>`;
  return `<div class="seg chips tmode">${b("mine","Mes mots")}${b("top","3000 mots courants")}</div>`;
}
function renderTop(){
  loadTop();
  const head = `<section class="panel tblp">${tableSwitch()}
    <input type="search" id="search" placeholder="Chercher parmi les 3000 mots…" value="${esc(listQuery)}">`;
  if (!TOP) return head + `<div class="empty">${topErr ? "Liste pas encore disponible (Internet ?)." : "Chargement des 3000 mots…"}</div></section>`;
  const mine = new Set(W.map(w => norm(w.en)));
  const canAdd = typeof window.addTopWord === "function";
  const q = norm(listQuery);
  const R = RANGES.find(r => r[0] === topRange) || RANGES[0];
  let rows = TOP.map((d, k) => ({ k, en: d[0], fr: d[1] }));
  rows = q ? rows.filter(x => norm(x.en).includes(q) || norm(x.fr).includes(q)) : rows.slice(R[2], R[3]);
  if (topMissing) rows = rows.filter(x => !mine.has(norm(x.en)));
  const nMine = TOP.filter(d => mine.has(norm(d[0]))).length;
  const chip = r => `<button data-trange="${r[0]}" class="${!q && topRange===r[0]?"on":""}">${r[1]}</button>`;
  return head + `
    <div class="seg chips" style="margin-top:10px">${RANGES.map(chip).join("")}</div>
    <label class="small tmiss"><input type="checkbox" data-tmiss ${topMissing?"checked":""}> Seulement ceux qui ne sont pas dans mes mots</label>
    <div class="small" style="margin:6px 0 4px">Classés du plus courant au moins courant. Tu en as déjà <b>${nMine}</b> dans tes mots (✓).${canAdd ? " Touche <b>+</b> pour en ajouter un à tes révisions." : ""} Touche un mot anglais pour l'écouter.</div>
    <div class="tblwrap"><table class="tbl ttop">
      <thead><tr><th>#</th><th>🇬🇧 Anglais</th><th>Nature et traduction</th><th></th></tr></thead>
      <tbody>${rows.length ? rows.map(x => {
        const have = mine.has(norm(x.en));
        return `<tr><td class="rk">${x.k + 1}</td><th scope="row"><span class="say" data-speak="${esc(x.en)}">${esc(x.en)}</span></th><td>${frHtml(x.fr)}</td><td class="ad">${have ? '<span class="ok">✓</span>' : canAdd ? `<button class="addone" data-topadd="${x.k}" aria-label="Ajouter ${esc(x.en)}">+</button>` : ""}</td></tr>`;
      }).join("") : `<tr><td colspan="4" class="empty">Aucun mot ici.</td></tr>`}</tbody>
    </table></div>
  </section>`;
}

function renderTable(){
  if (tableMode === "top") return renderTop();
  const q = norm(listQuery);
  const rows = W.filter(w => !q || norm(w.en).includes(q) || norm(w.fr).includes(q) || norm(w.mine).includes(q) || norm(w.note).includes(q));
  return `<section class="panel tblp">${tableSwitch()}
    <input type="search" id="search" placeholder="Chercher un mot…" value="${esc(listQuery)}">
    <div class="small" style="margin:10px 0 4px">Touche un mot anglais pour l'écouter, ou une case « Ma traduction » pour écrire la tienne. Fais glisser le tableau vers la gauche pour voir les autres colonnes.</div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>🇬🇧 Anglais</th><th>✍️ Ma traduction</th><th>🤖 Traduction de Claude</th><th>💡 Autres sens / remarque</th><th>Niveau</th></tr></thead>
      <tbody>${rows.length ? rows.map(w => {
        const lv = rec(w).b;
        return `<tr><th scope="row"><span class="say" data-speak="${esc(w.en)}">${esc(w.en)}</span></th>${editIdx===w.i
          ? `<td class="mc"><form id="mineform" autocomplete="off"><input type="text" id="mineinput" data-i="${w.i}" value="${esc(w.mine)}" placeholder="Ta traduction…" autocapitalize="off" spellcheck="false"><button class="btn main sm" type="submit">OK</button></form></td>`
          : `<td class="mc" data-edit="${w.i}">${w.mine ? esc(w.mine) : '<span class="ph">+ ajouter</span>'} <span class="pen">✎</span></td>`}<td>${frHtml(w.fr)}</td><td class="nt">${esc(w.note)}</td><td><div class="dots" title="Niveau ${lv}/5">${[1,2,3,4,5].map(k=>`<i class="${k<=lv?"f":""}"></i>`).join("")}</div></td></tr>`;
      }).join("") : `<tr><td colspan="5" class="empty">Aucun mot ici.</td></tr>`}</tbody>
    </table></div>
  </section>`;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === ((view==="list"||view==="table") ? view : "home")));
  document.querySelector(".wrap").classList.toggle("wide", view==="table");
  if (view==="home") $app.innerHTML = renderHome();
  else if (view==="play") $app.innerHTML = renderPlay();
  else if (view==="end") $app.innerHTML = renderEnd();
  else if (view==="list") $app.innerHTML = renderList();
  else if (view==="table") $app.innerHTML = renderTable();
  else if (view==="hist") $app.innerHTML = renderHist();
  // Dictée : le mot est prononcé tout seul à l'arrivée de chaque carte.
  if (view==="play" && S.mode==="dict" && !S.answered && S.said !== S.pos){
    S.said = S.pos; const wd = current(); setTimeout(() => speak(wd.en), 150);
  }
  if (view==="play" && (S.mode==="write" || S.mode==="dict") && !S.answered){
    const inp = document.getElementById("winput");
    if (inp) setTimeout(() => { try { inp.focus(); } catch(e){} }, 30);
  }
  if (view==="table" && editIdx!==null){
    const mi = document.getElementById("mineinput");
    if (mi) setTimeout(() => { try { mi.focus(); const n = mi.value.length; mi.setSelectionRange(n, n); } catch(e){} }, 30);
  }
}

// ---------- Événements ----------
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  if (view==="play" && b.dataset.tab==="home") return;
  view = b.dataset.tab; confirmReset = false; editIdx = null; render(); window.scrollTo(0,0);
});

$app.addEventListener("click", e => {
  const sp = e.target.closest("[data-speak]");
  if (sp) { e.stopPropagation(); speak(sp.dataset.speak); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed) { editIdx = +ed.dataset.edit; render(); return; }
  const t = e.target.closest("button, [data-flip]");
  if (!t) return;
  if (t.dataset.dir) { settings.dir = t.dataset.dir; saveSettings(); render(); return; }
  if (t.dataset.size) { settings.size = +t.dataset.size; saveSettings(); render(); return; }
  if (t.dataset.start) { start(t.dataset.start); window.scrollTo(0,0); return; }
  if (t.dataset.hist !== undefined) { view = "hist"; render(); window.scrollTo(0,0); return; }
  if (t.dataset.rmode) {
    if (t.dataset.rseen !== undefined) return startList(seenIdx(), t.dataset.rmode);
    const h = HIST[+t.dataset.rhist]; if (h) return startList(histIdx(h), t.dataset.rmode);
    return;
  }
  if (t.dataset.quit !== undefined || t.dataset.home !== undefined) { S = null; view = "home"; render(); return; }
  if (t.dataset.flip !== undefined) { S.answered = true; render(); return; }
  if (t.dataset.grade !== undefined) { answer(t.dataset.grade==="1"); next(); return; }
  if (t.dataset.opt !== undefined) {
    if (S.answered) return;
    const i = +t.dataset.opt, w = current();
    S.choice = i; S.answered = true;
    answer(i===w.i || sameAnswer(W[i],w,S.dir));
    render(); return;
  }
  if (t.dataset.giveup !== undefined) { S.typed = ""; S.okTyped = false; S.answered = true; answer(false); render(); return; }
  if (t.dataset.override !== undefined) {
    const w = current();
    // corrige la note : le mot compte comme réussi
    S.wrong = S.wrong.filter(i => i!==w.i); S.right.push(w.i);
    const idx = S.queue.lastIndexOf(w.i); if (idx > S.pos) S.queue.splice(idx,1);
    if (S.prev) P[w.en] = S.prev; else delete P[w.en];
    grade(w, true);
    S.okTyped = true; render(); return;
  }
  if (t.dataset.next !== undefined) { next(); window.scrollTo(0,0); return; }
  if (t.dataset.filter) { listFilter = t.dataset.filter; render(); return; }
  if (t.dataset.tmode) { tableMode = t.dataset.tmode; listQuery = ""; editIdx = null; topErr = false; render(); return; }
  if (t.dataset.trange) { topRange = t.dataset.trange; listQuery = ""; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.topadd !== undefined && TOP) { const d = TOP[+t.dataset.topadd]; if (d) window.addTopWord(d[0], d[1]); return; }
  if (t.dataset.reset !== undefined) { confirmReset = true; render(); return; }
  if (t.dataset.resetNo !== undefined) { confirmReset = false; render(); return; }
  if (t.dataset.resetYes !== undefined) { P = {}; lsSave(); scheduleDb(); confirmReset = false; render(); return; }
});

function commitMine(i, val){
  const w = W[i]; if (!w) return;
  if (String(val).trim() !== (w.mine || "")) setMine(w, val);
  if (editIdx === i) { editIdx = null; setTimeout(render, 0); }
}
// Pages « Mes mots » et « Tableau » : toucher l'écran ailleurs que sur une case, un bouton, un mot à
// écouter ou une traduction à modifier met le curseur dans la case « Chercher » (à la fin du texte).
document.addEventListener("click", e => {
  if (view !== "list" && view !== "table") return;
  if (document.getElementById("mineinput")) return;   // une traduction en cours de modification : on la laisse se fermer
  if (e.target.closest("input, textarea, select, button, a, label, [data-speak], [data-edit], #tabs")) return;
  const q = document.getElementById("search"); if (!q) return;
  q.focus();
  const n = q.value.length; try { q.setSelectionRange(n, n); } catch (err) {}
});
$app.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.tmiss !== undefined) { topMissing = e.target.checked; render(); }
});
$app.addEventListener("focusout", e => {
  if (e.target.id !== "mineinput") return;
  commitMine(+e.target.dataset.i, e.target.value);
});
$app.addEventListener("submit", e => {
  if (e.target.id !== "mineform") return;
  e.preventDefault();
  const mi = document.getElementById("mineinput");
  if (mi) commitMine(+mi.dataset.i, mi.value);
});

$app.addEventListener("submit", e => {
  if (e.target.id !== "wform") return;
  e.preventDefault();
  const val = document.getElementById("winput").value;
  if (!val.trim()) return;
  const w = current();
  S.typed = val.trim(); S.okTyped = S.mode === "dict" ? checkDict(w, val) : checkTyped(w, val); S.answered = true;
  answer(S.okTyped);
  render();
});

$app.addEventListener("input", e => {
  if (e.target.id !== "search") return;
  listQuery = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const s = document.getElementById("search");
  if (s) { s.focus(); try { s.setSelectionRange(pos,pos); } catch(err){} }
});

render();
</script>
</body>
</html>
