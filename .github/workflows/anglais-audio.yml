# Appli « Révisions d'anglais » : complète les mots ajoutés (depuis l'appli ou à la main) :
# phrase d'exemple (Tatoeba) et fréquence (anglais/tools/fill.py), puis sons de prononciation
# manquants (voix choisie dans anglais/tools/voice.txt ; si elle change, tous les sons sont refaits).
name: Révisions d'anglais - sons

on:
  push:
    branches: [main]
    paths: ["anglais/site/index.html", "anglais/site/exemples.json", "anglais/tools/**", ".github/workflows/anglais-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anglais-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Outils : ffmpeg sans ses paquets « recommandés » (beaucoup plus rapide), « apt-get update »
      # seulement si l'installation échoue ; paquets Python gardés en cache d'un passage à l'autre.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-edge-tts-wordfreq

      - name: Outils
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null 2>&1 \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
          fi
          pip install -q --disable-pip-version-check edge-tts wordfreq

      - name: Phrases d'exemple et fréquences des nouveaux mots
        run: python3 anglais/tools/fill.py anglais/site

      - name: Fabrication des sons
        run: python3 anglais/tools/make_audio.py anglais/site

      - name: Enregistrement dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add anglais/site/audio anglais/site/exemples.json anglais/site/frequences.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Anglais : phrases d'exemple, fréquences et sons des nouveaux mots"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
